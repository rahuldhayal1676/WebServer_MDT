[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/chembl"
  to = "/.netlify/functions/chembl"
  status = 200
  force = true

[[redirects]]
  from = "/api/uniprot"
  to = "/.netlify/functions/uniprot"
  status = 200
  force = true

[[redirects]]
  from = "/api/ncbi"
  to = "/.netlify/functions/ncbi"
  status = 200
  force = true

[[redirects]]
  from = "/api/unichem"
  to = "/.netlify/functions/unichem"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
